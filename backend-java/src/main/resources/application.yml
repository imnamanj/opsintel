spring:
  application:
    name: opsintel
  datasource:
    url: jdbc:postgresql://localhost:5432/opsintel
    username: opsintel
    password: opsintel_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-ms: 86400000
  storage:
    dir: uploads