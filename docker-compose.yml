services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opsintel-db
    environment:
      POSTGRES_DB: opsintel
      POSTGRES_USER: opsintel
      POSTGRES_PASSWORD: opsintel_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsintel -d opsintel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: